name: Deploy Funding functions to OZENO environments

on:
  push:
    branches: [codex/pages-simulator-preview]
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/public-funding-hint/**'
      - 'supabase/functions/prestudy-funding-leads/**'
      - 'supabase/functions/_shared/funding-public-preview.mjs'
      - 'supabase/functions/_shared/funding-core/**'
      - '.github/workflows/deploy-public-funding-hint.yml'

permissions:
  contents: read

concurrency:
  group: funding-functions-environments
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy public Funding hint to OZENO
        run: supabase functions deploy public-funding-hint --project-ref rniitydsksjrphulrlct --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy authenticated pre-study Funding leads to OZENO
        run: supabase functions deploy prestudy-funding-leads --project-ref rniitydsksjrphulrlct --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy public Funding hint to OZENO Beta
        run: supabase functions deploy public-funding-hint --project-ref dptympcfznaqcdvtdxok --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_BETA }}
      - name: Deploy authenticated pre-study Funding leads to OZENO Beta
        run: supabase functions deploy prestudy-funding-leads --project-ref dptympcfznaqcdvtdxok --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_BETA }}
