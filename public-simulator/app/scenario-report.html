  <style>
    .summaryKpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:20px 0 14px}

    .summaryKpiLabel{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.045em;text-transform:uppercase}
    .summaryKpi strong{overflow-wrap:anywhere;color:var(--ink);font-size:21px;line-height:1.2}
    .summaryKpiStatus{justify-self:start;padding:2px 8px;border-radius:999px;background:#e2eee7;color:#1b624e;font-size:10px;font-weight:800}
    .summaryKpi[data-status="UNKNOWN"]{background:var(--unknown)}
    .summaryKpi[data-status="UNKNOWN"] .summaryKpiStatus{background:#f4dfae;color:#754d00}
    .summaryKpi[data-status="STALE"] .summaryKpiStatus{background:#f4c7c1;color:#842f27}
    .summaryDashboard{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);align-items:stretch;gap:12px;margin:10px 0 14px}
    .summaryPanel{min-width:0;min-height:300px;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;break-inside:avoid;container-type:inline-size}
    .summaryPanel h3{margin:0 0 12px;color:var(--ink);font-size:17px}
    .summaryPanel .reportChart{min-height:208px;margin:0;padding:10px;border:0;background:transparent}
    .summaryPanel .reportChart svg{min-height:195px}
    .summaryUnknown{display:grid;min-height:190px;margin:0;padding:16px;place-items:center;border-radius:10px;background:var(--unknown);color:#77541a;text-align:center}
    .summaryFacts{display:grid;align-content:start}
    .summaryFactRow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:3px 12px;padding:9px 0;border-bottom:1px solid var(--line);break-inside:avoid}
    .summaryFactRow span{color:var(--muted)}

    .summaryFactRow small{grid-column:1/-1;color:#845f13;font-size:10px;font-weight:700}
    .summaryFactRow[data-status="STALE"] small{color:#842f27}
    .facts{gap:15px;margin-top:28px}
    .fact{padding:16px}

  <style>
